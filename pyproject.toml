[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxelcast"
version = "0.0.1"
description = "Desktop viewer for VAMToolbox 2D/3D results (PySide6 + VTK + pyqtgraph)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brandon Langdon" }]
dependencies = [
    "numpy>=1.24",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "tifffile>=2023.7",
]

[project.optional-dependencies]
# Needed only to load native VAM files (.target/.sino/.recon) and to run
# optimizations in-process. Viewing neutral files (.npy/.tiff) needs none of it.
engine = ["vamtoolbox"]
dev = ["pytest>=7"]

[project.scripts]
voxelcast = "voxelcast.app:main"

[project.gui-scripts]
voxelcast-gui = "voxelcast.app:main"

[tool.setuptools.packages.find]
include = ["voxelcast*"]
